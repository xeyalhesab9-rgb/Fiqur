<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Warzone Empire</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Three.js (3D Grafik Motoru) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background: #090d16;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 65vh;
            display: block;
        }
        .ui-panel {
            height: 35vh;
            background: #111827;
            border-top: 2px solid #1f2937;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #1f2937;
            padding: 10px;
            border-radius: 12px;
        }
        .stat-item { text-align: center; }
        .stat-title { font-size: 11px; color: #9ca3af; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: bold; color: #f59e0b; }
        
        .controls { display: flex; flex-direction: column; gap: 8px; }
        .btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .btn:active { transform: scale(0.98); }
        .btn-boost { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    </style>
</head>
<body>

    <!-- 3D Sahne Alanı -->
    <div id="canvas-container"></div>

    <!-- UI Kontrol Paneli -->
    <div class="ui-panel">
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-title">Qızıl Balansı</div>
                <div class="stat-value"><span id="gold">100</span> 🪙</div>
            </div>
            <div class="stat-item">
                <div class="stat-title">3D Baza Səviyyəsi</div>
                <div class="stat-value"><span id="income">0</span> /s</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="spawn3DUnit()">📦 3D Döyüşçü Çağır (<span id="cost">50</span> Qızıl)</button>
            <button class="btn btn-boost" onclick="addBoost()">⚡ 2x Hızlandırıcı (3D Boost)</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let gold = 100;
        let cost = 50;
        let selectedIndex = null;
        let gridData = [0, 0, 0, 0, 0, 0, 0, 0, 0];
        let meshes = [null, null, null, null, null, null, null, null, null];

        // --- THREE.JS 3D SAHNE KURULUMU ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x090d16);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 8, 7);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Işıklandırma (Lighting)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3D Grid (3x3 Baza Platformaları)
        const slotsPos = [];
        const slotGroup = new THREE.Group();

        for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 3; col++) {
                const x = (col - 1) * 1.8;
                const z = (row - 1) * 1.8;
                slotsPos.push({ x, z });

                // Platforma Görseli
                const geo = new THREE.BoxGeometry(1.5, 0.2, 1.5);
                const mat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.5 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, -0.1, z);
                mesh.receiveShadow = true;
                slotGroup.add(mesh);
            }
        }
        scene.add(slotGroup);

        // Asker Renkleri (Level Seviyelerine Göre)
        const levelColors = [
            0x22c55e, // Lv1: Yeşil
            0x3b82f6, // Lv2: Mavi
            0xa855f7, // Lv3: Mor
            0xf59e0b, // Lv4: Turuncu
            0xef4444  // Lv5: Kırmızı
        ];

        function create3DUnit(level, pos) {
            const group = new THREE.Group();
            
            // Asker Gövdesi (Cube/Robot Tasarımı)
            const geo = new THREE.BoxGeometry(0.8, 0.8 + (level * 0.15), 0.8);
            const mat = new THREE.MeshStandardMaterial({ 
                color: levelColors[(level - 1) % levelColors.length], 
                metalness: 0.3, 
                roughness: 0.2 
            });
            const body = new THREE.Mesh(geo, mat);
            body.position.y = (0.8 + (level * 0.15)) / 2;
            body.castShadow = true;
            group.add(body);

            group.position.set(pos.x, 0, pos.z);
            scene.add(group);
            return group;
        }

        // --- ETKİLEŞİM (3D RAYCASTING / TIKLAMA) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            if (e.clientY > rect.bottom) return;

            mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            // En yakın platformu bulma
            let closestSlot = -1;
            let minDist = Infinity;

            slotsPos.forEach((pos, idx) => {
                const p3d = new THREE.Vector3(pos.x, 0, pos.z);
                const intersects = raycaster.intersectObject(slotGroup.children[idx]);
                if (intersects.length > 0) {
                    closestSlot = idx;
                }
            });

            if (closestSlot !== -1) {
                handle3DClick(closestSlot);
            }
        });

        function handle3DClick(idx) {
            if (selectedIndex === null) {
                if (gridData[idx] > 0) selectedIndex = idx;
            } else {
                if (selectedIndex === idx) {
                    selectedIndex = null;
                } else if (gridData[selectedIndex] === gridData[idx] && gridData[idx] > 0) {
                    // 3D Birlikleri Birleştirme
                    gridData[idx] += 1;
                    gridData[selectedIndex] = 0;
                    
                    scene.remove(meshes[selectedIndex]);
                    scene.remove(meshes[idx]);
                    
                    meshes[selectedIndex] = null;
                    meshes[idx] = create3DUnit(gridData[idx], slotsPos[idx]);
                    
                    selectedIndex = null;
                } else {
                    selectedIndex = gridData[idx] > 0 ? idx : null;
                }
            }
            updateUI();
        }

        function spawn3DUnit() {
            const emptyIdx = gridData.indexOf(0);
            if (emptyIdx === -1) {
                alert("3D Sahada alan kalmadı!");
                return;
            }
            if (gold >= cost) {
                gold -= cost;
                gridData[emptyIdx] = 1;
                meshes[emptyIdx] = create3DUnit(1, slotsPos[emptyIdx]);
                cost = Math.floor(cost * 1.4);
                updateUI();
            } else {
                alert("Yetersiz altın!");
            }
        }

        function addBoost() {
            gold += 200;
            updateUI();
        }

        function updateUI() {
            document.getElementById('gold').innerText = Math.floor(gold);
            document.getElementById('cost').innerText = cost;
            
            let totalInc = 0;
            gridData.forEach(lvl => { if (lvl > 0) totalInc += lvl * 3; });
            document.getElementById('income').innerText = totalInc;
        }

        // Oyun Döngüsü & Animasyon
        function animate() {
            requestAnimationFrame(animate);
            
            // Askerlerin hafif dönme/nefes alma animasyonu
            meshes.forEach((mesh, idx) => {
                if (mesh) {
                    mesh.rotation.y += 0.01;
                    if (selectedIndex === idx) {
                        mesh.position.y = Math.sin(Date.now() * 0.005) * 0.2 + 0.1;
                    } else {
                        mesh.position.y = 0;
                    }
                }
            });

            renderer.render(scene);
        }

        setInterval(() => {
            let totalInc = 0;
            gridData.forEach(lvl => { if (lvl > 0) totalInc += lvl * 3; });
            gold += totalInc;
            document.getElementById('gold').innerText = Math.floor(gold);
        }, 1000);

        animate();
    </script>
</body>
</html>
