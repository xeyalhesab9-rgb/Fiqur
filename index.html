<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Warzone 3D Empire</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .header-panel {
            background: #1e293b;
            padding: 12px 15px;
            border-bottom: 2px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-box { text-align: center; }
        .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: bold; color: #f59e0b; }

        #gameCanvas {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #090d16;
            touch-action: none;
        }

        .controls-panel {
            background: #1e293b;
            padding: 15px;
            border-top: 2px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.98); }
        .btn-boost { background: linear-gradient(135deg, #ef4444, #dc2626); }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="stat-box">
            <div class="stat-label">Balans</div>
            <div class="stat-value"><span id="gold">100</span> 🪙</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Gəlir / Saniyə</div>
            <div class="stat-value"><span id="income">0</span> ⚡</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls-panel">
        <button class="btn" onclick="spawnUnit()">🪖 3D Asker Çağır (<span id="cost">50</span> Qızıl)</button>
        <button class="btn btn-boost" onclick="addBoost()">⚔️ Düşman Üssünü Yağmala (+200 Gold)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let gold = 100;
        let cost = 50;
        let selectedIndex = null;
        let grid = [1, 0, 0, 0, 0, 0, 0, 0, 0];

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 3D Birlik Seviye Renkleri ve Simgeleri
        const unitConfigs = {
            1: { color: "#22c55e", topColor: "#4ade80", icon: "🪖", inc: 2 },
            2: { color: "#3b82f6", topColor: "#60a5fa", icon: "🥷", inc: 6 },
            3: { color: "#a855f7", topColor: "#c084fc", icon: "💥", inc: 15 },
            4: { color: "#f59e0b", topColor: "#fbbf24", icon: "🏎️", inc: 40 },
            5: { color: "#ef4444", topColor: "#f87171", icon: "🚁", inc: 100 }
        };

        // İzometrik 3D Çizim Fonksiyonları
        function drawIsometricTile(x, y, size, isSelected, level) {
            const isoX = (x - y) * (size * 0.8) + canvas.width / 2;
            const isoY = (x + y) * (size * 0.4) + canvas.height / 3;

            // Zemin Izgarası
            ctx.beginPath();
            ctx.moveTo(isoX, isoY);
            ctx.lineTo(isoX + size * 0.8, isoY + size * 0.4);
            ctx.lineTo(isoX, isoY + size * 0.8);
            ctx.lineTo(isoX - size * 0.8, isoY + size * 0.4);
            ctx.closePath();

            ctx.fillStyle = isSelected ? "#38bdf8" : "#1e293b";
            ctx.fill();
            ctx.strokeStyle = isSelected ? "#f0f9ff" : "#334155";
            ctx.lineWidth = isSelected ? 3 : 1;
            ctx.stroke();

            // 3D Birlik Küpü Çizimi
            if (level > 0) {
                const conf = unitConfigs[level] || unitConfigs[1];
                const h = 35 + level * 5;
                const py = isoY - (isSelected ? 10 : 0);

                // Sol Yüzey
                ctx.beginPath();
                ctx.moveTo(isoX - size * 0.5, py + size * 0.3);
                ctx.lineTo(isoX, py + size * 0.55);
                ctx.lineTo(isoX, py + size * 0.55 - h);
                ctx.lineTo(isoX - size * 0.5, py + size * 0.3 - h);
                ctx.closePath();
                ctx.fillStyle = conf.color;
                ctx.fill();

                // Sağ Yüzey
                ctx.beginPath();
                ctx.moveTo(isoX, py + size * 0.55);
                ctx.lineTo(isoX + size * 0.5, py + size * 0.3);
                ctx.lineTo(isoX + size * 0.5, py + size * 0.3 - h);
                ctx.lineTo(isoX, py + size * 0.55 - h);
                ctx.closePath();
                ctx.fillStyle = conf.color;
                ctx.fill();
                ctx.fillStyle = "rgba(0,0,0,0.2)";
                ctx.fill();

                // Üst Yüzey
                ctx.beginPath();
                ctx.moveTo(isoX, py + size * 0.05 - h);
                ctx.lineTo(isoX + size * 0.5, py + size * 0.3 - h);
                ctx.lineTo(isoX, py + size * 0.55 - h);
                ctx.lineTo(isoX - size * 0.5, py + size * 0.3 - h);
                ctx.closePath();
                ctx.fillStyle = conf.topColor;
                ctx.fill();

                // İkon ve Seviye Etiketi
                ctx.font = "20px Arial";
                ctx.textAlign = "center";
                ctx.fillText(conf.icon, isoX, py + size * 0.35 - h);

                ctx.font = "bold 10px Arial";
                ctx.fillStyle = "#ffffff";
                ctx.fillText("Lv." + level, isoX, py + size * 0.55 - h);
            }

            return { isoX, isoY, size };
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let totalInc = 0;

            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const idx = row * 3 + col;
                    const level = grid[idx];
                    drawIsometricTile(col, row, 55, selectedIndex === idx, level);
                    if (level > 0) totalInc += (unitConfigs[level] ? unitConfigs[level].inc : 2);
                }
            }

            document.getElementById("gold").innerText = Math.floor(gold);
            document.getElementById("income").innerText = totalInc;
            document.getElementById("cost").innerText = cost;
            return totalInc;
        }

        // Tıklama Algılama
        canvas.addEventListener("pointerdown", (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            let clickedIdx = -1;
            let minDist = 45;

            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const isoX = (col - row) * 44 + canvas.width / 2;
                    const isoY = (col + row) * 22 + canvas.height / 3;
                    const dist = Math.hypot(clickX - isoX, clickY - (isoY + 20));

                    if (dist < minDist) {
                        minDist = dist;
                        clickedIdx = row * 3 + col;
                    }
                }
            }

            if (clickedIdx !== -1) {
                if (selectedIndex === null) {
                    if (grid[clickedIdx] > 0) selectedIndex = clickedIdx;
                } else {
                    if (selectedIndex === clickedIdx) {
                        selectedIndex = null;
                    } else if (grid[selectedIndex] === grid[clickedIdx] && grid[clickedIdx] > 0) {
                        if (grid[clickedIdx] < 5) {
                            grid[clickedIdx] += 1;
                            grid[selectedIndex] = 0;
                        }
                        selectedIndex = null;
                    } else {
                        selectedIndex = grid[clickedIdx] > 0 ? clickedIdx : null;
                    }
                }
                render();
            }
        });

        function spawnUnit() {
            const emptyIdx = grid.indexOf(0);
            if (emptyIdx === -1) {
                alert("Üste boş yer yok!");
                return;
            }
            if (gold >= cost) {
                gold -= cost;
                grid[emptyIdx] = 1;
                cost = Math.floor(cost * 1.35);
                render();
            } else {
                alert("Yetersiz altın!");
            }
        }

        function addBoost() {
            gold += 200;
            render();
        }

        setInterval(() => {
            gold += render();
        }, 1000);

        render();
    </script>
</body>
</html>
