<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bee Farm UI Game</title>
    <style>
        :root {
            --wood-dark: #4a2a18;
            --wood-medium: #8b5a2b;
            --wood-light: #c68a4c;
            --green-btn: #4caf50;
            --blue-btn: #2196f3;
            --yellow-accent: #ffc107;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
        }

        body {
            background-color: #7cb342;
            background-image: radial-gradient(#8bc34a 20%, transparent 20%);
            background-size: 16px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-screen {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 880px;
            background: linear-gradient(to bottom, #81d4fa 0%, #aed581 40%, #558b2f 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 12px;
        }

        /* Top Bar Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-container {
            background: #6d4c41;
            border: 3px solid #3e2723;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 2px 10px 2px 2px;
            color: #fff;
            position: relative;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: #a1887f;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            border: 2px solid #fff;
        }

        .level-badge {
            position: absolute;
            bottom: -5px;
            left: 12px;
            background: #ff9800;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #fff;
            font-weight: bold;
        }

        .balances {
            display: flex;
            flex-direction: column;
            margin-left: 10px;
            font-size: 13px;
            font-weight: bold;
        }

        .bal-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .menu-hamburger {
            width: 40px;
            height: 40px;
            background: #8d6e63;
            border: 2px solid #3e2723;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .menu-hamburger div {
            width: 22px;
            height: 4px;
            background: #fff;
            border-radius: 2px;
        }

        /* Stats Section */
        .stats-panel {
            background: #5d4037;
            border: 3px solid #3e2723;
            border-radius: 15px;
            padding: 6px 12px;
            margin: 8px 0;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #4e342e;
            padding: 5px 10px;
            border-radius: 20px;
        }

        .btn-blue {
            background: #1e88e5;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 12px;
        }

        /* Main Game Grid Container */
        .view-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .grid-board {
            background: #6d4c41;
            border: 4px solid #3e2723;
            border-radius: 15px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .grid-cell {
            background: #4e342e;
            aspect-ratio: 1;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .bee-img {
            font-size: 28px;
        }

        .lvl-badge {
            position: absolute;
            bottom: 3px;
            background: #4caf50;
            color: white;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* Side Menu Buttons */
        .side-menu {
            position: absolute;
            right: -5px;
            top: 20%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        .side-btn {
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid #8d6e63;
            border-radius: 20px 0 0 20px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: bold;
            color: #3e2723;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        /* Buy Controls */
        .buy-panel {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .buy-info {
            background: #5d4037;
            border: 2px solid #3e2723;
            border-radius: 12px;
            width: 30%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 4px;
        }

        .buy-btn {
            flex-grow: 1;
            background: #4caf50;
            border: 2px solid #2e7d32;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px #2e7d32;
            cursor: pointer;
        }

        .buy-btn:active {
            box-shadow: 0 1px #2e7d32;
            transform: translateY(3px);
        }

        /* Apiary Jar Screen Alternative */
        .apiary-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .jar-container {
            font-size: 100px;
            margin: 20px 0;
            position: relative;
        }

        .sell-btn {
            background: #2196f3;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px #1565c0;
            cursor: pointer;
        }

        /* Navigation Footer */
        .navbar {
            display: flex;
            justify-content: space-around;
            background: rgba(46, 125, 50, 0.8);
            border-radius: 15px;
            padding: 6px 2px;
            margin-top: 8px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0.7;
        }

        .nav-item.active {
            opacity: 1;
            transform: scale(1.1);
        }

        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="game-screen">
    <!-- Header -->
    <div class="header">
        <div class="profile-container">
            <div class="avatar">Y</div>
            <div class="level-badge" id="player-lvl">3</div>
            <div class="balances">
                <div class="bal-item">🍯 <span id="gold-bal">150.16</span></div>
                <div class="bal-item">💵 <span id="cash-bal">36 874.81</span></div>
            </div>
        </div>
        <div class="menu-hamburger">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <!-- Production Stats -->
    <div class="stats-panel">
        <div class="stat-row">
            <button class="btn-blue">Level</button>
            <span style="font-weight: bold;" id="level-percent">5.00%</span>
        </div>
        <div class="stat-row">
            <button class="btn-blue" style="background:#ff9800;">Production</button>
            <span style="font-weight: bold;">💧 <span id="prod-rate">452.0000</span> /hour</span>
        </div>
    </div>

    <!-- MAIN VIEW AREA -->
    <div class="view-section">
        <!-- Side Floating Buttons -->
        <div class="side-menu">
            <div class="side-btn" onclick="alert('Calculator opened!')">🧮 Calculator</div>
            <div class="side-btn" onclick="alert('Roulette spin!')">🎡 Roulette</div>
            <div class="side-btn" onclick="alert('Tasks list!')">📋 Tasks</div>
            <div class="side-btn" onclick="alert('Exchange menu!')">🔄 Exchanger</div>
            <div class="side-btn" onclick="alert('Withdrawal menu!')">👛 Withdrawal</div>
        </div>

        <!-- 1. Game Grid Screen -->
        <div id="game-view" style="display: flex; flex-direction: column;">
            <div class="grid-board" id="grid-container">
                <!-- 16 Cells will be generated by JS -->
            </div>

            <div class="buy-panel">
                <div class="buy-info">
                    <span style="font-size: 20px;">🐝</span>
                    <span style="font-size: 10px; color: #ccc;" id="next-bee-lvl">1 LVL</span>
                </div>
                <button class="buy-btn" onclick="buyBee()">Buy bee (💵 <span id="bee-price">100</span>)</button>
            </div>
        </div>

        <!-- 2. Apiary Screen -->
        <div id="apiary-view" class="apiary-screen">
            <div class="jar-container">🫙</div>
            <div style="background: rgba(0,0,0,0.5); color:white; padding: 5px 15px; border-radius: 10px; margin-bottom: 10px;">
                <span id="honey-collected">400.00</span> / 250 000
            </div>
            <button class="sell-btn" onclick="sellHoney()">Sell honey</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="navbar">
        <div class="nav-item" onclick="switchTab('friends')">
            <span class="nav-icon">👥</span>
            <span>Friends</span>
        </div>
        <div class="nav-item" onclick="switchTab('apiary')">
            <span class="nav-icon">🪵</span>
            <span>Apiary</span>
        </div>
        <div class="nav-item active" id="nav-game" onclick="switchTab('game')">
            <span class="nav-icon">🐝</span>
            <span>Game</span>
        </div>
        <div class="nav-item" onclick="switchTab('shop')">
            <span class="nav-icon">🏪</span>
            <span>Shop</span>
        </div>
        <div class="nav-item" onclick="switchTab('menu')">
            <span class="nav-icon">🎛️</span>
            <span>Menu</span>
        </div>
    </div>
</div>

<script>
    // Game State
    let cash = 36874.81;
    let gold = 150.16;
    let beePrice = 100;
    let gridData = Array(16).fill(null);
    let honeyStorage = 400.00;

    // Default setup matching screenshot
    gridData[0] = 7;
    gridData[1] = 6;
    gridData[2] = 5;
    gridData[3] = 2;
    gridData[12] = 10;

    function renderGrid() {
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        
        gridData.forEach((lvl, index) => {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.onclick = () => onCellClick(index);

            if (lvl !== null) {
                cell.innerHTML = `
                    <div class="bee-img">🐝</div>
                    <div class="lvl-badge">${lvl} LVL</div>
                `;
            }
            container.appendChild(cell);
        });

        // Calculate production rate based on levels
        let totalProd = gridData.reduce((acc, curr) => acc + (curr ? curr * 45 : 0), 0);
        document.getElementById('prod-rate').innerText = totalProd.toFixed(4);
    }

    function buyBee() {
        if (cash >= beePrice) {
            let emptyIndex = gridData.findIndex(slot => slot === null);
            if (emptyIndex !== -1) {
                cash -= beePrice;
                gridData[emptyIndex] = 1; // Add Level 1 bee
                beePrice = Math.floor(beePrice * 1.15); // Increase price
                updateUI();
                renderGrid();
            } else {
                alert("Grid is full!");
            }
        } else {
            alert("Not enough Cash!");
        }
    }

    function onCellClick(index) {
        // Upgrade bee logic on click
        if (gridData[index] !== null) {
            gridData[index] += 1;
            renderGrid();
        }
    }

    function updateUI() {
        document.getElementById('cash-bal').innerText = cash.toFixed(2);
        document.getElementById('gold-bal').innerText = gold.toFixed(2);
        document.getElementById('bee-price').innerText = beePrice;
        document.getElementById('honey-collected').innerText = honeyStorage.toFixed(2);
    }

    function switchTab(tabName) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        if (tabName === 'game') {
            document.getElementById('game-view').style.display = 'flex';
            document.getElementById('apiary-view').style.display = 'none';
            document.getElementById('nav-game').classList.add('active');
        } else if (tabName === 'apiary') {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('apiary-view').style.display = 'flex';
            event.currentTarget.classList.add('active');
        } else {
            alert(tabName.toUpperCase() + ' section coming soon!');
        }
    }

    function sellHoney() {
        if (honeyStorage > 0) {
            gold += honeyStorage / 10;
            alert(`Sold honey for ${honeyStorage / 10} Gold!`);
            honeyStorage = 0;
            updateUI();
        }
    }

    // Initialize
    renderGrid();
    updateUI();
</script>

</body>
</html>
