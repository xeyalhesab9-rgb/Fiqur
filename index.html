<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Warzone 3D Command</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background: #0b1120;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        
        /* Top Navigation / Stats */
        .header-panel {
            background: linear-gradient(180deg, #1e293b, #0f172a);
            padding: 12px 16px;
            border-bottom: 2px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .stat-card {
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-val { font-size: 16px; font-weight: bold; color: #f59e0b; }

        /* Canvas Area */
        #gameCanvas {
            flex: 1;
            width: 100%;
            touch-action: none;
            background: radial-gradient(circle at center, #1e293b 0%, #0b1120 100%);
        }

        /* Controls Panel */
        .controls-panel {
            background: #0f172a;
            padding: 15px;
            border-top: 2px solid #1e293b;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
        .btn {
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-attack { background: linear-gradient(135deg, #dc2626, #991b1b); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4); }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="stat-card">
            <span>🪙 Balans:</span>
            <span class="stat-val" id="gold">100</span>
        </div>
        <div class="stat-card">
            <span>⚡ Qazanc:</span>
            <span class="stat-val" style="color: #38bdf8;" id="income">0/s</span>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls-panel">
        <button class="btn" onclick="spawnUnit()">🪖 Birlik Çağır (<span id="cost">50</span> Gold)</button>
        <button class="btn btn-attack" onclick="attackBase()">⚔️ Düşmən Üssünə Hücum Et (+200 Gold)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let gold = 100;
        let cost = 50;
        let selectedIndex = null;
        let grid = [1, 0, 0, 0, 0, 0, 0, 0, 0];

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            render();
        }
        window.addEventListener('resize', resizeCanvas);

        // Birlik Türleri ve Detayları
        const unitTypes = {
            1: { color: "#22c55e", darkColor: "#15803d", topColor: "#4ade80", label: "🪖 Piyada", inc: 3 },
            2: { color: "#3b82f6", darkColor: "#1d4ed8", topColor: "#60a5fa", label: "🥷 Snayper", inc: 8 },
            3: { color: "#a855f7", darkColor: "#7e22ce", topColor: "#c084fc", label: "💥 Ağır Birlik", inc: 20 },
            4: { color: "#f59e0b", darkColor: "#b45309", topColor: "#fbbf24", label: "🏎️ Zirehli", inc: 50 },
            5: { color: "#ef4444", darkColor: "#b91c1c", topColor: "#f87171", label: "🚁 Helikopter", inc: 120 }
        };

        function drawIsoTile(col, row, isSelected, level) {
            // Büyük ve Ortalanmış İzometrik Koordinatlar
            const tileSize = Math.min(canvas.width / 4.5, 80);
            const startX = canvas.width / 2;
            const startY = canvas.height / 2.8;

            const isoX = startX + (col - row) * (tileSize * 0.9);
            const isoY = startY + (col + row) * (tileSize * 0.45);

            // Zemin Zirvesi / Platform
            ctx.beginPath();
            ctx.moveTo(isoX, isoY);
            ctx.lineTo(isoX + tileSize * 0.9, isoY + tileSize * 0.45);
            ctx.lineTo(isoX, isoY + tileSize * 0.9);
            ctx.lineTo(isoX - tileSize * 0.9, isoY + tileSize * 0.45);
            ctx.closePath();

            ctx.fillStyle = isSelected ? "#0284c7" : "#1e293b";
            ctx.fill();
            ctx.strokeStyle = isSelected ? "#38bdf8" : "#475569";
            ctx.lineWidth = isSelected ? 3 : 1.5;
            ctx.stroke();

            // 3D Birlik Binası / Asker
            if (level > 0) {
                const conf = unitTypes[level] || unitTypes[1];
                const h = 45 + level * 8;
                const py = isoY - (isSelected ? 12 : 0);

                // Sol Yan Yüz
                ctx.beginPath();
                ctx.moveTo(isoX - tileSize * 0.55, py + tileSize * 0.35);
                ctx.lineTo(isoX, py + tileSize * 0.6);
                ctx.lineTo(isoX, py + tileSize * 0.6 - h);
                ctx.lineTo(isoX - tileSize * 0.55, py + tileSize * 0.35 - h);
                ctx.closePath();
                ctx.fillStyle = conf.darkColor;
                ctx.fill();

                // Sağ Yan Yüz
                ctx.beginPath();
                ctx.moveTo(isoX, py + tileSize * 0.6);
                ctx.lineTo(isoX + tileSize * 0.55, py + tileSize * 0.35);
                ctx.lineTo(isoX + tileSize * 0.55, py + tileSize * 0.35 - h);
                ctx.lineTo(isoX, py + tileSize * 0.6 - h);
                ctx.closePath();
                ctx.fillStyle = conf.color;
                ctx.fill();

                // Üst Tavan Yüzeyi
                ctx.beginPath();
                ctx.moveTo(isoX, py + tileSize * 0.1 - h);
                ctx.lineTo(isoX + tileSize * 0.55, py + tileSize * 0.35 - h);
                ctx.lineTo(isoX, py + tileSize * 0.6 - h);
                ctx.lineTo(isoX - tileSize * 0.55, py + tileSize * 0.35 - h);
                ctx.closePath();
                ctx.fillStyle = conf.topColor;
                ctx.fill();

                // Etiket & İkon
                ctx.font = "bold 22px Arial";
                ctx.textAlign = "center";
                ctx.fillText(conf.label.split(' ')[0], isoX, py + tileSize * 0.4 - h);

                ctx.font = "bold 11px Arial";
                ctx.fillStyle = "#ffffff";
                ctx.fillText("Lv." + level, isoX, py + tileSize * 0.62 - h);
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let totalInc = 0;

            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const idx = row * 3 + col;
                    const level = grid[idx];
                    drawIsoTile(col, row, selectedIndex === idx, level);
                    if (level > 0) totalInc += (unitTypes[level] ? unitTypes[level].inc : 3);
                }
            }

            document.getElementById("gold").innerText = Math.floor(gold);
            document.getElementById("income").innerText = totalInc + "/s";
            document.getElementById("cost").innerText = cost;
            return totalInc;
        }

        canvas.addEventListener("pointerdown", (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            const tileSize = Math.min(canvas.width / 4.5, 80);
            const startX = canvas.width / 2;
            const startY = canvas.height / 2.8;

            let clickedIdx = -1;
            let minDist = tileSize * 0.8;

            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const isoX = startX + (col - row) * (tileSize * 0.9);
                    const isoY = startY + (col + row) * (tileSize * 0.45);
                    const dist = Math.hypot(clickX - isoX, clickY - (isoY + tileSize * 0.4));

                    if (dist < minDist) {
                        minDist = dist;
                        clickedIdx = row * 3 + col;
                    }
                }
            }

            if (clickedIdx !== -1) {
                if (selectedIndex === null) {
                    if (grid[clickedIdx] > 0) selectedIndex = clickedIdx;
                } else {
                    if (selectedIndex === clickedIdx) {
                        selectedIndex = null;
                    } else if (grid[selectedIndex] === grid[clickedIdx] && grid[clickedIdx] > 0) {
                        if (grid[clickedIdx] < 5) {
                            grid[clickedIdx] += 1;
                            grid[selectedIndex] = 0;
                        }
                        selectedIndex = null;
                    } else {
                        selectedIndex = grid[clickedIdx] > 0 ? clickedIdx : null;
                    }
                }
                render();
            }
        });

        function spawnUnit() {
            const emptyIdx = grid.indexOf(0);
            if (emptyIdx === -1) {
                alert("Üstə boş yer yoxdur!");
                return;
            }
            if (gold >= cost) {
                gold -= cost;
                grid[emptyIdx] = 1;
                cost = Math.floor(cost * 1.35);
                render();
            } else {
                alert("Kifayət qədər qızılınız yoxdur!");
            }
        }

        function attackBase() {
            gold += 200;
            alert("⚔️ Düşmən üssü yağmalandı! +200 Qızıl qazandınız.");
            render();
        }

        setInterval(() => {
            gold += render();
        }, 1000);

        setTimeout(resizeCanvas, 100);
    </script>
</body>
</html>
