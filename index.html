<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MonsterLand</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#8bdcff;
  color:#294d80;
  overflow-x:hidden;
}

button{
  border:0;
  cursor:pointer;
  font:inherit;
}

.app{
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(
      #8bdcff 0%,
      #c9f0ff 43%,
      #79c969 44%,
      #91d875 100%
    );
}

/* TOP */

.topbar{
  position:relative;
  z-index:10;
  width:94%;
  height:70px;
  margin:12px auto;
  padding:8px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  background:white;
  border-radius:36px;
  box-shadow:0 5px 20px #477a9925;
}

.logo{
  font-size:30px;
  font-weight:900;
  color:#168bd5;
  text-shadow:2px 3px white,3px 4px #274477;
}

.logo span{
  color:#ffc928;
}

.resource{
  height:48px;
  padding:5px 10px;
  display:flex;
  align-items:center;
  gap:8px;
  background:white;
  border-radius:26px;
  box-shadow:inset 0 0 0 1px #e4edf6;
}

.resource .icon{
  font-size:27px;
}

.resource strong{
  font-size:17px;
}

.plus{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#54ca6d;
  color:white;
  font-size:23px;
}

.space{
  flex:1;
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#dce6f1;
  display:grid;
  place-items:center;
  font-size:23px;
}

.settings{
  background:none;
  font-size:27px;
}

/* LEFT */

.left{
  position:absolute;
  z-index:8;
  top:105px;
  left:3%;
  width:230px;
}

.player{
  padding:15px;
  display:flex;
  gap:12px;
  align-items:center;
  background:white;
  border-radius:25px;
  box-shadow:0 5px 18px #477a9925;
}

.petmini{
  width:65px;
  height:65px;
  border-radius:50%;
  background:#b8efff;
  display:grid;
  place-items:center;
  font-size:43px;
}

.xp{
  width:130px;
  height:9px;
  margin-top:7px;
  background:#d8e1ee;
  border-radius:10px;
  overflow:hidden;
}

.xp span{
  display:block;
  width:40%;
  height:100%;
  background:#5dcc4e;
}

.side{
  position:relative;
  width:92px;
  height:92px;
  margin-top:13px;
  background:white;
  border-radius:25px;
  color:#365781;
  font-weight:bold;
  box-shadow:0 5px 18px #477a9925;
}

.side .icon{
  display:block;
  font-size:34px;
  margin-bottom:5px;
}

.badge{
  position:absolute;
  top:5px;
  right:7px;
  background:#ed5c76;
  color:white;
  border-radius:50%;
  padding:4px 7px;
}

/* MONSTER */

.monsterArea{
  position:absolute;
  z-index:4;
  top:185px;
  left:50%;
  transform:translateX(-50%);
  width:400px;
  text-align:center;
}

.name{
  width:270px;
  margin:auto;
  padding:13px 25px;
  text-align:left;
  background:white;
  border-radius:25px;
  font-weight:bold;
  box-shadow:0 5px 18px #477a9925;
}

.healthSmall{
  height:10px;
  margin-left:85px;
  margin-top:-10px;
  background:#d6e0ed;
  border-radius:10px;
}

.healthSmall span{
  display:block;
  width:67%;
  height:100%;
  background:#5cc94f;
  border-radius:10px;
}

.hp{
  display:inline-block;
  margin-top:4px;
  padding:8px 25px;
  background:white;
  border-radius:22px;
  font-weight:bold;
}

.monster{
  margin-top:15px;
  font-size:175px;
  line-height:180px;
  filter:drop-shadow(0 18px 8px #456d5438);
}

.speech{
  position:absolute;
  right:0;
  top:150px;
  width:60px;
  height:60px;
  background:white;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:32px;
}

/* STATS */

.stats{
  position:absolute;
  z-index:8;
  top:220px;
  right:3%;
  width:265px;
  padding:20px;
  background:white;
  border-radius:27px;
  box-shadow:0 5px 20px #477a9925;
}

.stat{
  margin-bottom:14px;
}

.statTitle{
  display:flex;
  gap:7px;
  font-weight:bold;
}

.statTitle span{
  margin-left:auto;
  font-size:13px;
  color:#75839a;
}

.bar{
  height:10px;
  margin-top:6px;
  background:#dce5ef;
  border-radius:10px;
  overflow:hidden;
}

.bar span{
  display:block;
  height:100%;
  border-radius:10px;
}

.healthBar{
  width:85%;
  background:#ef5c75;
}

.hungerBar{
  width:60%;
  background:#f3af29;
}

.energyBar{
  width:70%;
  background:#43ace7;
}

.feed{
  width:100%;
  margin-top:10px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
  background:#e4f3ff;
  border-radius:25px;
  color:#4775a5;
  font-weight:bold;
}

.feedIcon{
  font-size:35px;
}

/* ACTIONS */

.actions{
  position:absolute;
  z-index:9;
  left:50%;
  bottom:210px;
  transform:translateX(-50%);
  width:790px;
  display:flex;
  gap:16px;
}

.action{
  flex:1;
  height:78px;
  border-radius:40px;
  color:white;
  font-weight:bold;
  font-size:19px;
  box-shadow:0 6px 15px #34556c45;
}

.action small{
  display:block;
  margin-top:4px;
}

.egg{
  background:linear-gradient(#ff7292,#f65c79);
}

.food{
  background:linear-gradient(#4bd064,#25b75b);
}

.fight{
  background:linear-gradient(#9e60f1,#7441dc);
}

/* MONSTERS */

.collection{
  position:absolute;
  z-index:7;
  left:3%;
  bottom:78px;
  width:94%;
  height:165px;
  padding:18px 22px;
  background:white;
  border-radius:28px;
}

.collectionTitle{
  font-size:20px;
  font-weight:bold;
  margin-bottom:13px;
}

.cards{
  display:flex;
  gap:14px;
}

.card{
  flex:1;
  padding:9px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#eef3f9;
  border-radius:22px;
}

.cardImage{
  width:65px;
  height:65px;
  border-radius:18px;
  background:#c8efff;
  display:grid;
  place-items:center;
  font-size:40px;
}

.card:nth-child(2) .cardImage{
  background:#ebdcff;
}

.card:nth-child(3) .cardImage{
  background:#fff0d4;
}

.card:nth-child(4) .cardImage{
  background:#dcf3df;
}

.miniBar{
  width:90px;
  height:8px;
  margin-top:7px;
  background:#ccd7e7;
  border-radius:8px;
}

.miniBar span{
  display:block;
  width:60%;
  height:100%;
  background:#5dcc4e;
  border-radius:8px;
}

/* NAV */

.nav{
  position:absolute;
  z-index:12;
  left:6%;
  bottom:0;
  width:88%;
  height:75px;
  display:flex;
  align-items:center;
  background:white;
  border-radius:28px 28px 0 0;
}

.nav button{
  flex:1;
  background:none;
  color:#7a89a5;
  font-weight:bold;
}

.navIcon{
  display:block;
  font-size:27px;
  margin-bottom:2px;
}

.nav .active{
  color:#4c70d5;
}

.centerEgg{
  width:70px;
  height:70px;
  margin:-35px auto 0;
  border:6px solid white;
  border-radius:50%;
  background:linear-gradient(135deg,#ff7aad,#9957ed);
  display:grid;
  place-items:center;
  font-size:36px;
  box-shadow:0 5px 15px #4e559955;
}

/* MOBILE */

@media(max-width:850px){

  .topbar{
    height:58px;
  }

  .logo{
    font-size:22px;
  }

  .resource{
    display:none;
  }

  .left{
    top:90px;
    width:150px;
  }

  .player{
    padding:8px;
  }

  .petmini{
    width:45px;
    height:45px;
    font-size:30px;
  }

  .xp{
    width:80px;
  }

  .side{
    width:65px;
    height:65px;
    font-size:10px;
  }

  .side .icon{
    font-size:25px;
  }

  .stats{
    top:145px;
    width:190px;
    padding:13px;
  }

  .monsterArea{
    top:125px;
    width:300px;
  }

  .monster{
    font-size:130px;
    line-height:145px;
  }

  .actions{
    bottom:215px;
    width:94%;
  }

  .action{
    height:65px;
    font-size:14px;
  }

  .collection{
    bottom:70px;
    height:125px;
    padding:11px;
  }

  .collectionTitle{
    font-size:15px;
  }

  .card{
    padding:6px;
  }

  .cardImage{
    width:45px;
    height:45px;
    font-size:28px;
  }

  .card:nth-child(n+3){
    display:none;
  }

  .nav{
    height:70px;
  }

  .nav button{
    font-size:10px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

<div class="logo">
<span>Monster</span>Land
</div>

<div class="icon">🪙</div>

<script>

let coins = 1250;
let gems = 45;
let energy = 32;
let health = 85;
let hunger = 60;


function render(){

document.getElementById("coins").innerText =
coins.toLocaleString("en-US");

document.getElementById("gems").innerText =
gems;

document.getElementById("topEnergy").innerText =
energy + "/40";

document.getElementById("hp").innerText =
health + "/100";

document.getElementById("healthText").innerText =
health + "/100";

document.getElementById("hungerText").innerText =
hunger + "/100";

let energyPercent =
Math.min(100,energy * 2.5);

document.getElementById("energyText").innerText =
Math.round(energyPercent) + "/100";

document.getElementById("healthBar").style.width =
health + "%";

document.getElementById("hungerBar").style.width =
hunger + "%";

document.getElementById("energyBar").style.width =
energyPercent + "%";

}


function message(text){
alert(text);
}


function buyEgg(){

if(coins >= 100){

coins -= 100;

message("🥚 Yumurta alındı!");

}else{

message("Kifayət qədər Coin yoxdur.");

}

render();

}


function buyFood(){

if(coins >= 20){

coins -= 20;

hunger =
Math.min(100,hunger + 20);

message("🥩 Yem alındı!");

}else{

message("Kifayət qədər Coin yoxdur.");

}

render();

}


function feed(){

if(hunger < 100){

hunger =
Math.min(100,hunger + 20);

health =
Math.min(100,health + 20);

message("Bloo yeməklə bəsləndi!");

}else{

message("Bloo toxdur.");

}

render();

}


function fight(){

if(energy >= 5){

energy -= 5;

coins += 50;

health =
Math.max(0,health - 5);

message("⚔️ Döyüş bitdi! +50 Coin");

}else{

message("⚡ Enerji çatmır.");

}

render();

}


function dailyReward(){

coins += 100;

message("🎁 Daily Reward: +100 Coin");

render();

}


function quest(){

message(
"📜 Quest\n\n" +
"3 döyüş et\n" +
"Mükafat: 150 Coin"
);

}


function inventory(){

message("🎒 Inventory açıldı");

}


function ranking(){

message(
"🏆 Ranking\n\n" +
"1. Player123\n" +
"2. MonsterKing\n" +
"3. BlooMaster"
);

}


render();


// Telegram Mini App

if(window.Telegram){

Telegram.WebApp.ready();

Telegram.WebApp.expand();

}

</script>

</body>
                         </html>
